name: Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Forge
        working-directory: forge
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee ../forge-build.log

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '```'; tail -c 30000 forge-build.log || true; echo '```'; } > body.md
          gh issue create --repo "${{ github.repository }}" --title "Build FAILED: forge ${{ github.ref_name }} #${{ github.run_number }}" --body-file body.md

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: forge-mc1.20.1
          path: |
            forge/build/libs/*.jar
            !forge/build/libs/*-sources.jar

  fabric:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric
        working-directory: fabric
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee ../fabric-build.log

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '```'; tail -c 30000 fabric-build.log || true; echo '```'; } > body.md
          gh issue create --repo "${{ github.repository }}" --title "Build FAILED: fabric ${{ github.ref_name }} #${{ github.run_number }}" --body-file body.md

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: fabric-mc1.20.1
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-dev.jar
