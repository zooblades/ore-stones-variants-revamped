name: Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  neoforge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NeoForge
        working-directory: neoforge
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee ../neoforge-build.log

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '```'; tail -c 30000 neoforge-build.log || true; echo '```'; } > body.md
          gh issue create --repo "${{ github.repository }}" --title "Build FAILED: neoforge ${{ github.ref_name }} #${{ github.run_number }}" --body-file body.md

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-mc1.21.4
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-sources.jar

  fabric:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric
        working-directory: fabric
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee ../fabric-build.log

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '```'; tail -c 30000 fabric-build.log || true; echo '```'; } > body.md
          gh issue create --repo "${{ github.repository }}" --title "Build FAILED: fabric ${{ github.ref_name }} #${{ github.run_number }}" --body-file body.md

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: fabric-mc1.21.4
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-dev.jar

  smoke-fabric:
    needs: fabric
    runs-on: ubuntu-latest
    continue-on-error: true
    name: smoke fabric ${{ matrix.mc }}
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.21.2', '1.21.3', '1.21.4', '1.21.5']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: fabric-mc1.21.4
          path: jar

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Start a real server with the jar
        run: bash tools/smoke_test.sh fabric ${{ matrix.mc }} "$(ls jar/*.jar | head -1)"

  smoke-neoforge:
    needs: neoforge
    runs-on: ubuntu-latest
    continue-on-error: true
    name: smoke neoforge ${{ matrix.mc }}
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.21.2', '1.21.3', '1.21.4', '1.21.5']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: neoforge-mc1.21.4
          path: jar

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Start a real server with the jar
        run: bash tools/smoke_test.sh neoforge ${{ matrix.mc }} "$(ls jar/*.jar | head -1)"
