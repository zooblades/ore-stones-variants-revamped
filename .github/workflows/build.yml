name: Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  neoforge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NeoForge
        working-directory: neoforge
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee ../neoforge-build.log

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '```'; tail -c 30000 neoforge-build.log || true; echo '```'; } > body.md
          gh issue create --repo "${{ github.repository }}" --title "Build FAILED: neoforge ${{ github.ref_name }} #${{ github.run_number }}" --body-file body.md

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: neoforge
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-sources.jar

  fabric:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric
        working-directory: fabric
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee ../fabric-build.log

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '```'; tail -c 30000 fabric-build.log || true; echo '```'; } > body.md
          gh issue create --repo "${{ github.repository }}" --title "Build FAILED: fabric ${{ github.ref_name }} #${{ github.run_number }}" --body-file body.md

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: fabric
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-dev.jar

  release:
    needs: [neoforge, fabric]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la artifacts
          gh release create "${{ github.ref_name }}-build-${{ github.run_number }}" artifacts/*.jar \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }} build ${{ github.run_number }}" \
            --notes "Automatic build of commit ${{ github.sha }} (branch ${{ github.ref_name }})" \
            --target "${{ github.sha }}"
